/* ---------- 日付・状態判定 ---------- */

function formatDate(s) {
  if (!s) return "";
  const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s);
  return m ? `${Number(m[2])}/${Number(m[3])}` : s;
}
function formatFullDate(s) {
  const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || "");
  return m ? `${m[1]}/${m[2]}/${m[3]}` : s || "—";
}
function daysUntil(iso) {
  const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(iso || "");
  if (!m) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - today) / 86400000);
}

// done=実施済み / overdue=月が過ぎたのに未実施 / now=今月予定 / plan=先の予定
function itemStatus(item) {
  if (item.done) return "done";
  const now = new Date();
  const ym = now.getFullYear() * 12 + now.getMonth() + 1;
  const target = item.year * 12 + item.month;
  if (target < ym) return "overdue";
  if (target === ym) return "now";
  return "plan";
}
const STATUS_LABEL = {
  done: "実施済",
  overdue: "未実施",
  now: "今月",
  plan: "予定"
};
function expiryInfo(v) {
  const d = daysUntil(v.expiry);
  if (d === null || v.sold) return null;
  if (d > EXPIRY_WARN_DAYS) return null;
  // 期限の約3ヶ月前以降に車検を実施済みなら、期限日の更新漏れとして扱う
  const renewed = v.items.some(i => i.done && i.content.includes("車検") && i.year * 12 + i.month >= Number(v.expiry.slice(0, 4)) * 12 + Number(v.expiry.slice(5, 7)) - 3);
  if (renewed) return {
    color: C.now,
    text: "車検済・期限日を更新",
    renewed: true
  };
  if (d < 0) return {
    color: C.overdue,
    text: `期限切れ ${-d}日`
  };
  if (d <= EXPIRY_WARN_DAYS) return {
    color: C.now,
    text: `あと${d}日`
  };
  return null;
}

// 車検月を基準に、3ヶ月点検を3・6・9ヶ月ずらしで配置
function autoSchedule(expiry, year) {
  const m = /^(\d{4})-(\d\d)/.exec(expiry || "");
  if (!m) return [];
  const sm = Number(m[2]);
  const items = [{
    id: newId(),
    year,
    month: sm,
    content: "車検",
    date: "",
    shop: "",
    done: false
  }];
  [3, 6, 9].forEach(off => {
    items.push({
      id: newId(),
      year,
      month: (sm - 1 + off) % 12 + 1,
      content: "3ヶ月",
      date: "",
      shop: "",
      done: false
    });
  });
  return items.sort((a, b) => a.month - b.month);
}

function csvText(data, year) {
  const esc = val => {
    const s = val === undefined || val === null ? "" : String(val);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;

    data.vehicles.filter(v => typeOf(v.type).key === t.key).forEach(v => {
      const items = v.items.filter(i => i.year === year).sort((a, b) => a.month - b.month);

  });

  return "\uFEFF" + csv;
}
