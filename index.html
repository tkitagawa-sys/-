<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>運賃適正価格計算ツール</title>
  <meta name="description" content="トラック運送業の運賃適正価格を計算するツール" />
